name: windows-build
on:
  pull_request: {}
  workflow_dispatch: {}
  merge_group: {}
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CI: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --immutable
      - name: Compile
        run: yarn nx run-many -t compile -p @aws-cdk/toolkit-lib aws-cdk
      - name: Generate CLI version files
        run: ./generate.sh
        working-directory: packages/aws-cdk
      - name: Test @aws-cdk/toolkit-lib
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest --passWithNoTests
        working-directory: packages/@aws-cdk/toolkit-lib
      - name: Test aws-cdk
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest --passWithNoTests
        working-directory: packages/aws-cdk
    timeout-minutes: 90
