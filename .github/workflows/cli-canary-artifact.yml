name: cli-canary-artifact
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  upload:
    name: Build and upload CLI tarball for the Windows canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'aws/aws-cdk-cli'
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enable corepack
        id: enable_corepack
        run: corepack enable
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --immutable
      - name: Build and pack the CLI
        id: build_and_pack_the_cli
        run: yarn nx run aws-cdk:package
      - name: Resolve the packed tarball
        id: tarball
        run: |-
          TARBALL="$(ls packages/aws-cdk/dist/js/*.tgz)"
          COUNT="$(echo "$TARBALL" | wc -l | tr -d " ")"
          if [ "$COUNT" != "1" ] || [ -z "$TARBALL" ]; then
            echo "::error::Expected exactly one CLI tarball, found: $TARBALL"
            exit 1
          fi
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/aws-cdk/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Mask role ARNs in logs
        id: mask_role_arns_in_logs
        env:
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME_FOR_ACCOUNT }}
          PUBLISHING_ROLE_TO_ASSUME: ${{ vars.CANARY_ARTIFACT_ROLE_ARN }}
        run: |-
          echo "::add-mask::$ROLE_TO_ASSUME"
          echo "::add-mask::$PUBLISHING_ROLE_TO_ASSUME"
      - name: Authenticate Via OIDC Role
        id: creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FOR_ACCOUNT }}
          role-session-name: cli-canary-upload@aws-cdk-cli
          mask-aws-account-id: true
      - name: Assume the canary publishing role
        id: publishing-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.CANARY_ARTIFACT_ROLE_ARN }}
          role-session-name: cli-canary-upload@aws-cdk-cli
          mask-aws-account-id: true
          role-chaining: true
      - name: Upload CLI tarball and latest pointer
        id: upload_cli_tarball_and_latest_pointer
        env:
          BUCKET_NAME: ${{ vars.CANARY_ARTIFACT_BUCKET_NAME }}
          TARBALL_PATH: ${{ steps.tarball.outputs.path }}
          CLI_VERSION: ${{ steps.tarball.outputs.version }}
        run: |-
          echo "::add-mask::$BUCKET_NAME"
          SHA="$GITHUB_SHA"
          BUILT_AT="$(date +%s)"

          echo "Uploading CLI tarball to s3://$BUCKET_NAME/cli/$SHA.tgz"
          aws s3 cp "$TARBALL_PATH" "s3://$BUCKET_NAME/cli/$SHA.tgz"

          printf '{"sha":"%s","cliVersion":"%s","builtAt":%s}\n' \
            "$SHA" "$CLI_VERSION" "$BUILT_AT" > latest.json
          echo "latest.json contents:"
          cat latest.json
          aws s3 cp latest.json "s3://$BUCKET_NAME/cli/latest.json" --content-type application/json
