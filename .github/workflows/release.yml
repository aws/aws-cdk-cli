          name: aws-cdk-testing-cli-integ_build-artifact
      - name: Restore build artifact permissions
        id: restore_build_artifact_permissions
        run: cd dist && setfacl --restore=permissions-backup.acl
        continue-on-error: true
      - name: Release
        id: release
        env:
          NPM_DIST_TAG: latest
          NPM_REGISTRY: registry.npmjs.org
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TRUSTED_PUBLISHER: "true"
          PUBLIB_DRYRUN: ${{ inputs.dry_run }}
        run: npx '-p' 'publib@latest' 'publib-npm'
  aws-cdk-testing-cli-integ_release_done:
    name: "@aws-cdk-testing/cli-integ: Release complete"
    needs:
      - aws-cdk-testing-cli-integ_release_github
      - aws-cdk-testing-cli-integ_release_npm
    runs-on: ubuntu-latest
    permissions: {}
    if: ${{ !cancelled() && !failure() }}
    steps:
      - id: auto_9c3c4914
