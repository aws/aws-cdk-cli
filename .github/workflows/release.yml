    name: "@aws-cdk-testing/cli-integ: Publish to GitHub Releases"
    needs: aws-cdk-testing-cli-integ_release_npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: releasing
    if: ${{ !cancelled() && !failure() && needs.aws-cdk-testing-cli-integ_release.result == 'success' }}
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          name: aws-cdk-testing-cli-integ_build-artifact
      - name: Restore build artifact permissions
        id: restore_build_artifact_permissions
        run: cd dist && setfacl --restore=permissions-backup.acl
        continue-on-error: true
      - name: Release
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG_FILE: dist/releasetag.txt
          CHANGELOG_FILE: dist/changelog.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          errout=$(mktemp)
          tag=$(cat "$RELEASE_TAG_FILE")
          gh release create "$tag" -R "$GITHUB_REPOSITORY" -F "$CHANGELOG_FILE" -t "$tag" --target "$GITHUB_SHA" ${PRERELEASE:+-p} 2> "$errout" && true
          exitcode=$?
          if [ $exitcode -ne 0 ] && ! grep -q "Release.tag_name already exists" "$errout"; then
            cat "$errout"
            exit $exitcode
          fi
  aws-cdk-testing-cli-integ_release_npm:
    name: "@aws-cdk-testing/cli-integ: Publish to npm"
    needs: aws-cdk-testing-cli-integ_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: releasing
    if: ${{ !cancelled() && !failure() && needs.aws-cdk-testing-cli-integ_release.result == 'success' }}
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
